name: CI

on:
  push:
    branches: [main, master]
    paths:
      - grammar.js
      - src/**
      - queries/**
      - test/**
      - bindings/**
      - binding.gyp
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - grammar.js
      - src/**
      - queries/**
      - test/**
      - bindings/**
      - binding.gyp
      - .github/workflows/ci.yml
      - Makefile
      - package.json
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  versions:
    # The Makefile is the single source of truth for the toolchain versions.
    # Every other job reads them from here rather than repeating a literal.
    # Runs on Linux so the matrix jobs need no `make` on Windows.
    name: Resolve Versions
    runs-on: ubuntu-latest
    outputs:
      tree-sitter: ${{steps.read.outputs.tree-sitter}}
      abi: ${{steps.read.outputs.abi}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read versions from the Makefile
        id: read
        run: |
          {
            echo "tree-sitter=$(make ts-version)"
            echo "abi=$(make abi-version)"
          } >> "$GITHUB_OUTPUT"

      - name: Check the copies that cannot be derived
        run: |
          set -eu
          abi=$(make abi-version)
          ts=$(make ts-version)

          # devDependencies cannot reference the Makefile, so assert instead.
          pinned=$(jq -r '.devDependencies["tree-sitter-cli"]' package.json)
          if [ "$pinned" != "${ts#v}" ]; then
            echo "package.json pins tree-sitter-cli $pinned, Makefile says $ts" >&2
            exit 1
          fi

          # The committed parser is the artifact editors actually load; if it
          # is not at the pinned ABI, Emacs cannot use it.
          built=$(sed -n 's/#define LANGUAGE_VERSION //p' src/parser.c)
          if [ "$built" != "$abi" ]; then
            echo "src/parser.c is ABI $built, Makefile says $abi" >&2
            echo "run 'npm run generate' and commit the result" >&2
            exit 1
          fi

  test:
    name: Test Parser
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: ${{needs.versions.outputs.tree-sitter}}

      - name: Report tree-sitter version
        run: tree-sitter --version
        shell: bash

      - name: Run parser tests
        uses: tree-sitter/parser-test-action@v3
        with:
          test-rust: ${{runner.os == 'Linux'}}
          test-node: true
          test-python: false
          test-go: true
          test-swift: false
          # Node 20 bundles npm 10 / node-gyp 10, which does not recognise
          # Visual Studio 2026 and so cannot build the node binding on the
          # windows-2025-vs2026 runner.  Node 24 bundles npm 11.19 with
          # node-gyp >= 12.1, which knows VS major version 18.  Node >= 22
          # headers also require C++20, which needs tree-sitter >= 0.25.1 —
          # 0.25.0's binding.gyp hardcodes C++17.
          node-version: '24'
          abi-version: ${{needs.versions.outputs.abi}}

  parse-examples:
    name: Parse Examples
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: ${{needs.versions.outputs.tree-sitter}}

      - name: Parse example files
        uses: tree-sitter/parse-action@v4
        with:
          files: test/files.txt

  check-queries:
    name: Check Queries
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: ${{needs.versions.outputs.tree-sitter}}

      - name: Compile every query against the grammar
        run: |
          for query in queries/*.scm; do
            echo "== $query"
            tree-sitter query "$query" \
              test/files/dream/example/w-template-logic/template.eml.ml \
              > /dev/null
          done
